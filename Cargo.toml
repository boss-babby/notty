[package]
name = "lumen"
version = "5.5.0"
edition = "2021"
description = "Lumen — a free Notion + Obsidian alternative written entirely in Rust with egui (Windows + WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
hayro = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
arboard = { version = "3", default-features = false }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
# Native web preview: WebView2 (Chromium-based, ships with Windows 10/11) in a child window that only exists while a preview is open.
wry = { version = "0.53", default-features = false, features = ["os-webview"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rfd's build script insists on a Linux backend feature even for wasm32; the feature pulls in nothing there.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlElement", "HtmlAnchorElement", "Node", "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "HtmlIFrameElement", "CssStyleDeclaration", "DomRect", "HtmlCollection", "Storage"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
# unwind on native so a damaged PDF can never take the app down (the PDF engine catches panics); wasm always aborts
panic = "unwind"

# Smaller, slower-to-build profile used by build-web.sh (download size matters in the browser).
[profile.web]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# eframe 0.31.1 with a patched web backend (vendor/eframe/src/web): touch events are no longer delivered twice / out of order
# (that made a scroll swipe look like a drag-selection) and the soft keyboard no longer flickers (see vendor/eframe/PATCHES.md).
[patch.crates-io]
eframe = { path = "vendor/eframe" }
