[package]
name = "lumen"
version = "11.1.0"
edition = "2021"
description = "Lumen — a free Notion + Obsidian + Miro-lite alternative (infinite canvas) written entirely in Rust with egui (Windows + WebAssembly), with automations, reminders and the LumenScript scripting language"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "lumen"

[[bin]]
name = "lumen"
path = "src/main.rs"

# Headless Model Context Protocol server over stdio (Claude Desktop, Cursor, scripts): lumen-mcp --workspace backup.json
[[bin]]
name = "lumen-mcp"
path = "src/bin/lumen_mcp.rs"

[dependencies]
egui = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
hayro = "0.9"
ehttp = "0.5"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
env_logger = "0.11"
arboard = { version = "3", default-features = false }
webbrowser = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.eframe]
version = "0.31"
default-features = false
features = ["default_fonts", "glow", "persistence"]

# Android: NativeActivity (android-activity) + winit + glow/EGL. The Java half lives in android/ (see build-android.sh).
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
egui-winit = { version = "0.31.1", default-features = false }
jni = "0.21"
android_logger = "0.14"

[target.'cfg(windows)'.dependencies]
# Native web preview: WebView2 (Chromium-based, ships with Windows 10/11) in a child window that only exists while a preview is open.
wry = { version = "0.53", default-features = false, features = ["os-webview"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.5"
# rfd's build script insists on a Linux backend feature even for wasm32; the feature pulls in nothing there.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlElement", "HtmlAnchorElement", "Node", "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "HtmlIFrameElement", "CssStyleDeclaration", "DomRect", "HtmlCollection", "Storage", "Location"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# no incremental / debug info in release: smaller binary, smaller page-in footprint
debug = false
strip = true
# unwind on native so a damaged PDF can never take the app down (the PDF engine catches panics); wasm always aborts
panic = "unwind"

# Android: release speed + a smaller, faster-starting .so (used by build-android.sh). Unwinding stays on (the PDF engine catches panics).
[profile.android]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
debug = false
incremental = false

# Smaller, slower-to-build profile used by build-web.sh (download size matters in the browser).
[profile.web]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# eframe 0.31.1 with a patched web backend (vendor/eframe/src/web): touch events are no longer delivered twice / out of order
# (that made a scroll swipe look like a drag-selection) and the soft keyboard no longer flickers (see vendor/eframe/PATCHES.md).
[patch.crates-io]
eframe = { path = "vendor/eframe" }
# egui-winit 0.31.1 without winit's own soft-keyboard handling on Android (vendor/egui-winit/src/lib.rs, "Lumen patch")
egui-winit = { path = "vendor/egui-winit" }
# egui_glow 0.31.1 with highp shaders: the stock mediump precision is 16-bit on Android GPUs and sliced / blurred the glyph atlas lookups
egui_glow = { path = "vendor/egui_glow" }
# epaint 0.31.1 with HarfBuzz shaping (rustybuzz) + bidi reordering for complex scripts (vendor/epaint/src/text/text_layout.rs, "Lumen")
epaint = { path = "vendor/epaint" }
# egui 0.31.1 with a fix for the "dialogs stay as small as they were once" bug (vendor/egui/src/containers/area.rs, "Lumen patch")
egui = { path = "vendor/egui" }

# Read by `cargo apk` (plain NativeActivity package). The production APK is assembled by ./build-android.sh instead, because Lumen
# ships its own Java activity (window insets, soft keyboard, Storage-Access-Framework file dialogs, clipboard, print) that cargo-apk
# cannot compile. Both use the same package name and the same libs.
[package.metadata.android]
package = "com.lumen.app"
label = "Lumen"
assets = "assets"
build_targets = ["aarch64-linux-android"]
apk_name = "lumen"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
theme = "@android:style/Theme.Material.NoActionBar"

# `cargo apk build --release` needs a release key; build-android.sh uses the very same keystore.
[package.metadata.android.signing.release]
path = "android/lumen-release.jks"
keystore_password = "lumen-release"
