<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #fff; overscroll-behavior: none; touch-action: none; }
  @media (prefers-color-scheme: dark) { html, body { background: #191919; } #loading { color: #aaa; } }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             font: 15px system-ui, sans-serif; color: #666; gap: 14px; }
  .spin { width: 28px; height: 28px; border: 3px solid #8884; border-top-color: #2f80ed; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #err { display: none; max-width: 420px; padding: 0 20px; text-align: center; }
</style>
</head>
<body>
<canvas id="lumen_canvas"></canvas>
<div id="loading"><div class="spin"></div><div id="msg">Loading Lumen…</div><div id="err"></div></div>
<script type="module">
  import init, { LumenWeb } from "./lumen.js";
  const msg = document.getElementById("msg");
  try {
    await init({ module_or_path: "./lumen_bg.wasm" });
    const app = new LumenWeb();
    await app.start(document.getElementById("lumen_canvas"));
    document.getElementById("loading").remove();
    window.addEventListener("pagehide", () => app.destroy());
  } catch (e) {
    console.error(e);
    msg.textContent = "Lumen could not start in this browser (WebGL / WebAssembly required).";
    document.querySelector(".spin").style.display = "none";
    const err = document.getElementById("err");
    err.style.display = "block";
    err.textContent = String(e && e.message ? e.message : e);
  }
</script>
</body>
</html>
