<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--BASE-->
  <title>Lumen — workspace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
  <meta name="application-name" content="Lumen" />
  <meta name="apple-mobile-web-app-title" content="Lumen" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Lumen — a Notion + Obsidian alternative written entirely in Rust (egui), running as WebAssembly." />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; overscroll-behavior: none; touch-action: none;
      -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #191919; } }
    /* The stage follows the *visual* viewport (script below): when the on-screen keyboard opens it shrinks, so the editor and its toolbar sit above it.
       Notch / home-bar insets become padding, so no UI is ever hidden under them. */
    #stage { position: fixed; left: 0; top: var(--vvt, 0px); width: 100%; height: var(--vvh, 100%); box-sizing: border-box; background: inherit;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    #stage.kb { padding-bottom: 0; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #555; background: inherit; z-index: 5; transition: opacity .3s; }
    @media (prefers-color-scheme: dark) { #loader { color: #aaa; } }
    #loader .logo { font-size: 34px; font-weight: 700; letter-spacing: -.02em; color: #2383e2; }
    #bar { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: rgba(128,128,128,.25); overflow: hidden; }
    #fill { height: 100%; width: 0%; background: #2383e2; border-radius: 3px; transition: width .15s; }
    #bar.indeterminate #fill { width: 35%; animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    #err { display: none; max-width: 520px; padding: 0 24px; text-align: center; color: #d44c47; }
    #err a { color: #2383e2; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="lumen_canvas" tabindex="0"></canvas></div>
  <div id="loader">
    <div class="logo">Lumen</div>
    <div id="msg">Loading workspace…</div>
    <div id="bar" class="indeterminate"><div id="fill"></div></div>
    <div id="err"></div>
  </div>
  <script>
    // ── notifications bridge (called from Rust, see src/platform.rs) ─────────────────────────────────────────────────────
    // lumenNotifyState()          → "granted" | "denied" | "default" | "unsupported"
    // lumenNotifyRequest()        → asks for permission (needs a user gesture: the app calls it from a click)
    // lumenNotify(title, body, tag) → shows a system notification through the service worker (works for installed PWAs / phones)
    // lumenSchedule(json)         → [{at, title, body, tag}] reminders of the next hours; fired by setTimeout so they work in a
    //                               background tab where the canvas is not repainting. Persisted so a reload re-arms them.
    (function () {
      const shown = new Map();           // tag → time, de-duplicates the Rust-side and the timer-side notification
      let timers = [];
      const supported = () => "Notification" in window;
      window.lumenNotifyState = () => (supported() ? Notification.permission : "unsupported");
      window.lumenNotifyRequest = () => { if (supported() && Notification.permission === "default") Notification.requestPermission().catch(() => {}); };
      async function show(title, body, tag) {
        if (!supported() || Notification.permission !== "granted") return;
        const now = Date.now();
        if (tag && shown.has(tag) && now - shown.get(tag) < 10 * 60 * 1000) return;
        if (tag) shown.set(tag, now);
        const opts = { body: body || "", tag: tag || undefined, icon: "icons/icon-192.png", badge: "icons/icon-192.png", data: { url: "/app" }, renotify: false };
        try {
          const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration("/") : null;
          if (reg && reg.showNotification) { await reg.showNotification(title, opts); return; }
        } catch (_) {}
        try { new Notification(title, opts); } catch (_) {}
      }
      window.lumenNotify = (title, body, tag) => { show(String(title), String(body), String(tag || "")); };
      function arm(items) {
        timers.forEach(clearTimeout); timers = [];
        const now = Date.now();
        for (const it of items) {
          const wait = it.at - now;
          if (wait < -60000 || wait > 14 * 24 * 3600 * 1000) continue;
          timers.push(setTimeout(() => show(it.title, it.body, it.tag), Math.max(0, wait)));
        }
      }
      window.lumenSchedule = (json) => {
        try { const items = JSON.parse(json); localStorage.setItem("lumen_push_schedule", json); arm(items); } catch (_) {}
      };
      // re-arm after a reload (the app pushes a fresh list as soon as it is running)
      try { const j = localStorage.getItem("lumen_push_schedule"); if (j) arm(JSON.parse(j)); } catch (_) {}
    })();
  </script>
  <script type="module">
    import init, { LumenWeb } from "./lumen.js?v=__BUILD__";

    // ── mobile viewport plumbing ──────────────────────────────────────────────────────────────────────────────────
    const stage = document.getElementById("stage");
    const vv = window.visualViewport;
    function fitViewport() {
      const h = vv ? vv.height : window.innerHeight;
      stage.style.setProperty("--vvh", h + "px");
      stage.style.setProperty("--vvt", (vv ? vv.offsetTop : 0) + "px");
      stage.classList.toggle("kb", !!vv && window.innerHeight - vv.height > 120);
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);   // iOS pans the page when the keyboard opens
    }
    fitViewport();
    if (vv) { vv.addEventListener("resize", fitViewport); vv.addEventListener("scroll", fitViewport); }
    window.addEventListener("resize", fitViewport);
    window.addEventListener("orientationchange", () => setTimeout(fitViewport, 250));
    // no browser pinch-zoom / long-press menu / double-tap zoom: the app handles every gesture itself
    for (const t of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(t, (e) => e.preventDefault());
    // press-and-hold is handled by the app (it is a right-click there): no browser context menu, no native text selection / callout
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("selectstart", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    // installable + offline (PWA): see sw.js
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register(new URL("sw.js?v=__BUILD__", document.baseURI), { scope: "/" }).catch(() => {}));
    }

    const msg = document.getElementById("msg");
    const bar = document.getElementById("bar");
    const fill = document.getElementById("fill");
    const err = document.getElementById("err");
    const loader = document.getElementById("loader");

    function fail(text) {
      msg.textContent = "Lumen could not start";
      bar.style.display = "none";
      err.style.display = "block";
      err.innerHTML = text + '<br><br><a href="./">Reload</a>';
    }

    // Stream the .wasm so a progress bar can be shown (falls back to an indeterminate bar when the size is unknown).
    async function fetchWasm() {
      const url = new URL("./lumen_bg.wasm?v=__BUILD__", import.meta.url);
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status + " while loading lumen_bg.wasm");
      const total = Number(res.headers.get("content-length")) || 0;
      if (!res.body || !total) return res;
      let got = 0;
      bar.classList.remove("indeterminate");
      const reader = res.body.getReader();
      const stream = new ReadableStream({
        async pull(ctrl) {
          const { done, value } = await reader.read();
          if (done) { ctrl.close(); return; }
          got += value.length;
          fill.style.width = Math.min(99, Math.round((got / total) * 100)) + "%";
          msg.textContent = "Loading workspace… " + (got / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB";
          ctrl.enqueue(value);
        },
      });
      return new Response(stream, { headers: { "content-type": "application/wasm" } });
    }

    try {
      if (!("WebAssembly" in window)) throw new Error("This browser does not support WebAssembly.");
      const wasm = await fetchWasm();
      await init({ module_or_path: wasm });
      msg.textContent = "Starting…";
      const app = new LumenWeb();
      await app.start(document.getElementById("lumen_canvas"));
      window.__lumenReady = true;
      loader.style.opacity = "0";
      setTimeout(() => loader.remove(), 350);
      window.addEventListener("pagehide", () => { try { app.destroy(); } catch (_) {} });
    } catch (e) {
      console.error(e);
      fail(String(e && e.message ? e.message : e));
    }
  </script>
</body>
</html>
